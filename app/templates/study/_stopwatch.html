{# Count-up stopwatch; turns red past the target time. Needs: target_seconds. The server measures the real time. #}
<span class="muted">⏱ <span class="timer" id="stopwatch">0:00</span> <span class="small">/ meta {{ target_seconds | mmss }}</span></span>
<script>
  (function () {
    const el = document.getElementById('stopwatch');
    const target = {{ target_seconds | int }};
    const start = Date.now();
    function tick() {
      const s = Math.floor((Date.now() - start) / 1000);
      el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      el.classList.toggle('over', s > target);
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
