# Blueprint do Render (https://render.com/docs/blueprint-spec): demo pública no plano gratuito,
# construída a partir do Dockerfile (com o GitHub conectado, cada push na branch main atualiza a demo).
services:
  - type: web
    name: gmat-focus-trainer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "1"
